# Velox with engineered edge vector features + parallel decoder
#
# Edge vector: src_type_onehot + dst_type_onehot + 8 temporal/novelty features
# Parallel decoder: logits_node (src+dst only) + logits_edge (src+dst+edge_vector)
# Loss = loss_node + edge_loss_lambda * loss_edge

_include_yml: velox

construction:
  temporal_features:
    enabled: True
    num_features: 8

batching:
  edge_features: edge_type,edge_vector
  edge_vector_proj_dim: 32

training:
  decoder:
    predict_edge_type:
      edge_loss_lambda: 0.3
