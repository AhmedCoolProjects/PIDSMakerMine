# Velox with engineered edge vector features (src_type + dst_type + temporal/volumic/novelty)
#
# Edge vector: src_type_onehot + dst_type_onehot + feature_names features.
# num_features is auto-derived from len(feature_names) when feature_names is set.
#
# Available features:
#   temporal:   t_norm, log_delta_prev, log_delta_same_pair, log_delta_src_activity, log_delta_dst_activity
#   volumetric: pair_freq_causal, src_unique_dsts_norm, pair_type_count_norm, src_burst_new_pairs
#   novelty:    type_rarity, is_new_pair, is_new_type_for_src, is_new_type_for_pair,
#               is_new_src_for_dst, is_new_path_global
#   path-based: is_tmp_dst, is_hash_filename_dst, is_server_port_outbound, is_execute_from_tmp
#   causal:     write_then_execute_flag

_include_yml: velox

construction:
  temporal_features:
    enabled: True
    num_features: 10  # kept for backward compat; overridden by len(feature_names) when set
    feature_names:
      - t_norm
      - log_delta_prev
      - log_delta_same_pair
      - log_delta_src_activity
      - pair_freq_causal
      - src_unique_dsts_norm
      - pair_type_count_norm
      - type_rarity
      - is_new_pair
      - is_new_type_for_src

batching:
  edge_features: edge_type,edge_vector
  edge_vector_proj_dim: 32
