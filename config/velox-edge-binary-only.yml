# Variation 1: Binary-Only Feature Set (anti-compression baseline)
#
# All features are binary {0,1} — no continuous normalization.
# Hypothesis: binary features cannot compress normal-edge loss distribution,
# so max_val_loss threshold stays high enough to detect CADETS attacks.
# Expected: ADP improves for CADETS; first candidate to achieve TP > 0 on CADETS.
#
# Exp IDs: ve_binary_only_cs, ve_binary_only_ca

_include_yml: velox-edge

construction:
  temporal_features:
    enabled: True
    feature_names:
      - is_new_pair
      - is_new_type_for_src
      - is_new_type_for_pair
      - is_new_src_for_dst
      - is_new_path_global
      - is_tmp_dst
      - write_then_execute_flag

batching:
  edge_vector_proj_dim: 16
